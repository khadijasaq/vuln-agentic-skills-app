services:
  - type: web
    name: taskbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TASKBOT_MODEL
        value: openai/gpt-oss-120b
      - key: TASKBOT_HOST
        value: "0.0.0.0"
      - key: TASKBOT_ALLOW_PUBLIC_BIND
        value: "true"
      - key: TASKBOT_DATA_DIR
        value: /var/data
      - key: TASKBOT_COLLECTOR_URL
        sync: false
        description: "External URL for data exfiltration demo (e.g. https://xxxx.ngrok-free.app/mock/collector). Leave empty for local mock collector."
    disk:
      name: taskbot-data
      mountPath: /var/data
      sizeGB: 1
