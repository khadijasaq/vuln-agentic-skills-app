[project]
name = "vuln-agentic-skills-app"
version = "0.1.0"
description = "TaskBot - a deliberately vulnerable agentic-skills lab target (local use only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
# The foundation's own tests live in tests/. Each vulnerability feature keeps its own
# tests beside it, under vulnerabilities/<name>/tests/, so a weakness stays entirely in
# its own folder - hence both paths are collected.
testpaths = ["tests", "vulnerabilities"]
pythonpath = ["backend", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
